name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in what we ship (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (includes the SQL, run in a real in-memory Postgres)
        run: npm test
      - name: Build (demo mode, so no secrets are needed)
        run: npm run build
        env:
          SPARKTHUNDER_DEMO: "1"
          NEXT_TELEMETRY_DISABLED: "1"
